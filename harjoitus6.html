<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="maindiv">
        <button id="btn" class="btn">press me</button>
        <p id="textfield" class="textfield"></p>
    </div>

    <script>
        const btn = document.querySelector("#btn")
        const text = document.querySelector("#textfield")
       
        btn.addEventListener("click", looper)

        function looper() {

            fontS = 16

            for(let i = 0; i < 11; i++) {
                fontS += 3
                text.innerHTML += `<p style="font-size: ${fontS}px">Tässä on luku ${i}<p>`; 
            }
        }
    </script>
</body>
</html>
