<!DOCTYPE html>
<html lang="fi">
<link rel="stylesheet" href="style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="maindiv">

        <div class="inputdiv">
            <input class="inputfield" id="inputfield" type="text" placeholder="insert name here">
            <button class="btn" id="btn">submit</button>
        </div>
        <div class="textdiv">
            <p class="textfield" id="textfield"></p>
        </div>
    </div>


    <script>

        const textField = document.getElementById("textfield");
        const inputField = document.getElementById("inputfield");
        const btn = document.getElementById("btn")

        btn.addEventListener("click", submitF)

        function submitF() {
            const v = inputField.value;
            textField.innerHTML = "Hei sinun nimesi on: " + v;
            inputField.value = "";
        }


    </script>

</body>
</html>
